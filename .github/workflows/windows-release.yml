name: Windows release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet packages
        run: dotnet restore DLMngr.sln

      - name: Publish self-contained Windows app
        run: |
          dotnet publish DLMngrApp\DLMngrApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:UseAppHost=true `
            --output ./publish

      - name: Archive output
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./DLMngrApp-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLMngrApp-win-x64
          path: ./DLMngrApp-win-x64.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./DLMngrApp-win-x64.zip
